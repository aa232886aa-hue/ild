name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Directory Structure
      run: |
        # פקודה שמוודאת שה-HTML והמניפסט נמצאים איפה שה-Gradle מחפש אותם
        mkdir -p app/src/main/assets
        # מוצא את index.html ומעביר אותו לתיקייה הנכונה
        find . -name "index.html" -exec cp {} app/src/main/assets/index.html \;
        # מוצא את ה-AndroidManifest שהעלית ומעביר אותו למקום הנכון ליתר ביטחון
        MANIFEST_PATH=$(find . -name "AndroidManifest.xml" -print -quit)
        mkdir -p app/src/main
        cp "$MANIFEST_PATH" app/src/main/AndroidManifest.xml

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 7.5
    - name: Build with Gradle
      run: gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
