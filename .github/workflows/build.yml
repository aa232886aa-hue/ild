name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Project From Scratch
      run: |
        mkdir -p app/src/main/java/com/example/myapp
        mkdir -p app/src/main/assets
        cp index.html app/src/main/assets/index.html
        
        echo "android.useAndroidX=true" > gradle.properties
        echo "include ':app'" > settings.gradle
        
        # בניית build.gradle ראשי
        printf "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:7.3.0' } }\nallprojects { repositories { google(); mavenCentral() } }" > build.gradle
        
        # בניית build.gradle של האפליקציה
        printf "plugins { id 'com.android.application' }\nandroid { namespace 'com.example.myapp'; compileSdk 33; defaultConfig { applicationId 'com.example.myapp'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' } }\ndependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
        
        # יצירת המניפסט בצורה הכי פשוטה - שורה אחר שורה כדי לוודא ששום דבר לא נמחק
        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://android.com" package="com.example.myapp">' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.RECORD_AUDIO" />' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' >> app/src/main/AndroidManifest.xml
        echo '    <application android:label="App" android:theme="@style/Theme.AppCompat.Light.NoActionBar">' >> app/src/main/AndroidManifest.xml
        echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> app/src/main/承担Manifest.xml
        echo '        </activity>' >> app/src/main/AndroidManifest.xml
        echo '    </application>' >> app/src/main/AndroidManifest.xml
        echo '</manifest>' >> app/src/main/AndroidManifest.xml

        # יצירת קוד ה-Java
        printf "package com.example.myapp;\nimport android.Manifest;\nimport android.os.Bundle;\nimport android.webkit.*;\nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\nimport android.content.pm.PackageManager;\npublic class MainActivity extends AppCompatActivity {\n    protected void onCreate(Bundle saved) {\n        super.onCreate(saved);\n        WebView w = new WebView(this);\n        setContentView(w);\n        w.getSettings().setJavaScriptEnabled(true);\n        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {\n            ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 1);\n        }\n        w.setWebChromeClient(new WebChromeClient() {\n            public void onPermissionRequest(PermissionRequest r) { r.grant(r.getResources()); }\n        });\n        w.setWebViewClient(new WebViewClient());\n        w.loadUrl(\"file:///android_asset/index.html\");\n    }\n}" > app/src/main/java/com/example/myapp/MainActivity.java

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 7.5
    - name: Build with Gradle
      run: gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
